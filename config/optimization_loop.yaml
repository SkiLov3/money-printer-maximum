---
optimization:
  enabled: true
  max_iterations: 10
  target_score: 500.0
  optimization_days: 60
  max_changes_per_iteration: 3
  plateau_threshold: 0.02
  plateau_iterations: 3
  objective: total_pnl

persistence:
  enabled: true
  reports_dir: reports/optimization_loop
  memory_path: reports/optimization_loop/optimizer_memory.jsonl

claude:
  enabled: false
  model: "claude-sonnet-5.5"
  command: ["claude", "-p", "--model", "claude-sonnet-5.5"]
  timeout_seconds: 600
  rate_limit_retries: 1

codex:
  enabled: false
  command: ["codex", "exec", "--full-auto"]
  timeout_seconds: 600

gemini:
  enabled: false
  command: ["gemini", "-p"]
  timeout_seconds: 600

external_agents:
  max_provider_calls_per_iteration: 1
  max_prompt_chars: 8000

validation:
  run_full_dataset: true

editable_files:
  - config/trading_stack.yaml
  - src/strategies/price_action_bs.py
  - src/trading/filters.py
  - src/trading/router.py
  - src/agents/risk_agent.py
  - src/discovery/service.py
  - src/agents/supervisor_agent.py
